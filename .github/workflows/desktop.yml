name: Desktop app (Windows + macOS)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
            target: ""
          - os: macos-latest
            args: "--target universal-apple-darwin"
            target: "universal-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install frontend deps
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Build & release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: "AIPoint Share __VERSION__"
          releaseBody: |
            **Windows:** download the `.exe` installer. SmartScreen may warn (unsigned) → *More info → Run anyway*.
            **macOS:** download the `.dmg`, drag to Applications. First open: right-click → Open (unsigned build), or run `xattr -cr "/Applications/AIPoint Share.app"`.

            Same mesh as https://share.aipoint.online — web users and app users see each other.
            App ↔ app on the same network uses a direct multi-stream LAN TCP path (folders as-is, no zip).
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
